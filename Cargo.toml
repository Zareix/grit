[workspace]
resolver = "2"
members = ["crates/grit-core", "crates/grit"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
authors = ["Raphaël C."]

[workspace.dependencies]
git2 = "0.21"
anyhow = "1"
thiserror = "2"

# UI
gpui-kit = "0.7.3"
# Perf HUD (FRAME/P95/DROP/INV, CPU/GPU/MEM) — rendered only when
# GRIT_FPS=1, so it costs nothing in normal runs.
gpui-fps = "0.7.3"

# session persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# internal
grit-core = { path = "crates/grit-core" }

[profile.dev.package.git2]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

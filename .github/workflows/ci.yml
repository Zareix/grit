name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        # gpui-pre-linux → gpui-pre-wgpu → zed-font-kit links fontconfig via
        # pkg-config (fontconfig.pc). That is the only build-time system dep.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: CI
        run: just ci

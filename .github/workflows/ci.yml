name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        # gpui-pre-linux → gpui-pre-wgpu → zed-font-kit links fontconfig via
        # pkg-config, and the gpui X11/XWayland backend links libxcb +
        # libxkbcommon(-x11) directly. They are the only build-time deps: the
        # stock rust:bookworm image ships fontconfig, which masked this in my
        # local docker check, and `cargo check` doesn't link either.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: CI
        run: just ci

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    name: Get version
    uses: zareix/gh-actions/.github/workflows/get-version.yml@main
    with:
      type: regex
      file: Cargo.toml
      # Workspace version ([workspace.package] at the top of the file).
      regex: '^version = "\K[^"]+'

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PWD: ${{ secrets.MACOS_CERT_PWD }}
      KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_P8: ${{ secrets.NOTARY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p gk-desktop

      - name: Bundle .app
        run: |
          SHORT="${VERSION#v}"
          APP_DIR="git-desktop.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          cp target/release/git-desktop "$APP_DIR/Contents/MacOS/git-desktop"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key>
              <string>git-desktop</string>
              <key>CFBundleDisplayName</key>
              <string>git-desktop</string>
              <key>CFBundleIdentifier</key>
              <string>com.zareix.git-desktop</string>
              <key>CFBundleExecutable</key>
              <string>git-desktop</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${SHORT}</string>
              <key>CFBundleVersion</key>
              <string>${SHORT}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true />
              <key>ITSAppUsesNonExemptEncryption</key>
              <false />
            </dict>
          </plist>
          PLIST
          plutil -lint "$APP_DIR/Contents/Info.plist"

      - name: Import signing certificate (verbose, with diagnostics)
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode --output "$CERT"
          # Decoded artifact sanity: size + hash prove the secret was intact.
          ls -l "$CERT"
          shasum -a 256 "$CERT"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$MACOS_CERT_PWD" \
            -T /usr/bin/codesign -f pkcs12
          # Register the keychain in the default search list so codesign
          # resolves the identity later.
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign .app (Developer ID + hardened runtime)
        run: |
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_IDENTITY" git-desktop.app
          codesign --verify --deep --strict --verbose=2 git-desktop.app

      - name: Create dmg
        # dmg-root staging: app + /Applications symlink for the classic
        # drag-and-drop install, per the packaging guide.
        run: |
          mkdir -p dmg-root
          cp -R git-desktop.app dmg-root/git-desktop.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname git-desktop -srcfolder dmg-root \
            -format UDZO "git-desktop-aarch64-macos.dmg"

      - name: Notarize dmg
        run: |
          P8="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_P8" | base64 --decode --output "$P8"
          xcrun notarytool submit "git-desktop-aarch64-macos.dmg" \
            --key "$P8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

      - name: Staple dmg
        run: |
          xcrun stapler staple git-desktop-aarch64-macos.dmg
          # Validation check before shipping per the packaging guide.
          xcrun stapler validate git-desktop-aarch64-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-macos
          path: git-desktop-aarch64-macos.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p gk-desktop

      - name: Package exe
        shell: pwsh
        run: Compress-Archive -Path target/release/git-desktop.exe -DestinationPath "git-desktop-x64-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-windows
          path: git-desktop-x64-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # Same set as ci.yml: fontconfig (pkg-config link) + xcb/xkbcommon
        # (direct link from the gpui X11 backend).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked -p gk-desktop

      - name: Package tarball
        run: |
          mkdir -p dist/portable/git-desktop/bin
          cp target/release/git-desktop dist/portable/git-desktop/bin/git-desktop
          tar -czf "git-desktop-x64-linux.tar.gz" -C dist/portable git-desktop
          tar -tzf "git-desktop-x64-linux.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-linux
          path: git-desktop-x64-linux.tar.gz
          if-no-files-found: error

  collect:
    name: Collect assets
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: git_desktop_release
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, collect]
    permissions:
      contents: write
    uses: zareix/gh-actions/.github/workflows/release.yml@main
    with:
      tag: ${{ needs.version.outputs.version }}
      assets: git_desktop_release

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    name: Get version
    uses: zareix/gh-actions/.github/workflows/get-version.yml@main
    with:
      type: regex
      file: Cargo.toml
      # Workspace version ([workspace.package] at the top of the file).
      regex: '^version = "\K[^"]+'

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_P8: ${{ secrets.NOTARY_P8 }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p grit

      - name: Bundle .app
        run: |
          SHORT="${VERSION#v}"
          APP_DIR="grit.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp target/release/grit "$APP_DIR/Contents/MacOS/grit"
          cp packaging/grit.icns "$APP_DIR/Contents/Resources/grit.icns"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key>
              <string>Grit</string>
              <key>CFBundleDisplayName</key>
              <string>Grit</string>
              <key>CFBundleIdentifier</key>
              <string>com.zareix.grit</string>
              <key>CFBundleIconFile</key>
              <string>grit</string>
              <key>CFBundleExecutable</key>
              <string>grit</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${SHORT}</string>
              <key>CFBundleVersion</key>
              <string>${SHORT}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true />
              <key>ITSAppUsesNonExemptEncryption</key>
              <false />
            </dict>
          </plist>
          PLIST
          plutil -lint "$APP_DIR/Contents/Info.plist"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PWD }}

      - name: Sign .app (Developer ID + hardened runtime)
        run: |
          codesign --force --timestamp --options runtime \
            --sign "$APPLE_IDENTITY" grit.app
          codesign --verify --deep --strict --verbose=2 grit.app

      - name: Create dmg
        # dmg-root staging: app + /Applications symlink for the classic
        # drag-and-drop install, per the packaging guide.
        run: |
          mkdir -p dmg-root
          cp -R grit.app dmg-root/grit.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Grit -srcfolder dmg-root \
            -format UDZO "grit-aarch64-macos.dmg"

      - name: Notarize dmg
        run: |
          P8="$RUNNER_TEMP/notary.p8"
          echo "$NOTARY_P8" | base64 --decode --output "$P8"
          xcrun notarytool submit "grit-aarch64-macos.dmg" \
            --key "$P8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

      - name: Staple dmg
        run: |
          xcrun stapler staple grit-aarch64-macos.dmg
          # Validation check before shipping per the packaging guide.
          xcrun stapler validate grit-aarch64-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grit-macos
          path: grit-aarch64-macos.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p grit

      - name: Package exe
        shell: pwsh
        run: Compress-Archive -Path target/release/grit.exe -DestinationPath "grit-x64-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grit-windows
          path: grit-x64-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        # Same set as ci.yml: fontconfig (pkg-config link) + xcb/xkbcommon
        # (direct link from the gpui X11 backend).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig-dev \
            pkg-config \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Build release binary
        run: cargo build --release --locked -p grit

      - name: Package tarball
        run: |
          mkdir -p dist/portable/grit/bin \
            dist/portable/grit/share/icons/hicolor/256x256/apps
          cp target/release/grit dist/portable/grit/bin/grit
          cp packaging/grit.png \
            dist/portable/grit/share/icons/hicolor/256x256/apps/grit.png
          tar -czf "grit-x64-linux.tar.gz" -C dist/portable grit
          tar -tzf "grit-x64-linux.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: grit-linux
          path: grit-x64-linux.tar.gz
          if-no-files-found: error

  collect:
    name: Collect assets
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: grit-*
          merge-multiple: true
          path: release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: git_desktop_release
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, collect]
    permissions:
      contents: write
    uses: zareix/gh-actions/.github/workflows/release.yml@main
    with:
      tag: ${{ needs.version.outputs.version }}
      assets: git_desktop_release

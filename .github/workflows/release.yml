name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  version:
    name: Get version
    uses: zareix/gh-actions/.github/workflows/get-version.yml@main
    with:
      type: regex
      file: Cargo.toml
      # Workspace version ([workspace.package] at the top of the file).
      regex: '^version = "\K[^"]+'

  build-macos:
    name: Build macOS (arm64)
    runs-on: macos-latest
    needs: [version]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p gk-desktop

      - name: Bundle .app
        run: |
          SHORT="${VERSION#v}"
          APP_DIR="git-desktop.app"
          mkdir -p "$APP_DIR/Contents/MacOS"
          cp target/release/git-desktop "$APP_DIR/Contents/MacOS/git-desktop"
          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>CFBundleName</key>
              <string>git-desktop</string>
              <key>CFBundleDisplayName</key>
              <string>git-desktop</string>
              <key>CFBundleIdentifier</key>
              <string>com.zareix.git-desktop</string>
              <key>CFBundleExecutable</key>
              <string>git-desktop</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${SHORT}</string>
              <key>CFBundleVersion</key>
              <string>${SHORT}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true />
              <key>ITSAppUsesNonExemptEncryption</key>
              <false />
            </dict>
          </plist>
          PLIST
          # Validate the bundle per the packaging guide, then seal it. Ad-hoc
          # signature only: a public release needs Developer ID + notarization.
          plutil -lint "$APP_DIR/Contents/Info.plist"
          codesign --force --sign - "$APP_DIR"

      - name: Create dmg
        run: hdiutil create -volname git-desktop -srcfolder git-desktop.app -format UDZO "git-desktop-aarch64-macos.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-macos
          path: git-desktop-aarch64-macos.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: [version]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p gk-desktop

      - name: Package exe
        shell: pwsh
        run: Compress-Archive -Path target/release/git-desktop.exe -DestinationPath "git-desktop-x64-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-windows
          path: git-desktop-x64-windows.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p gk-desktop

      - name: Package tarball
        run: |
          mkdir -p dist/portable/git-desktop/bin
          cp target/release/git-desktop dist/portable/git-desktop/bin/git-desktop
          tar -czf "git-desktop-x64-linux.tar.gz" -C dist/portable git-desktop
          tar -tzf "git-desktop-x64-linux.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-desktop-linux
          path: git-desktop-x64-linux.tar.gz
          if-no-files-found: error

  collect:
    name: Collect assets
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: git-desktop-*
          merge-multiple: true
          path: release-assets

      - uses: actions/upload-artifact@v4
        with:
          name: git_desktop_release
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Create release
    needs: [version, collect]
    permissions:
      contents: write
    uses: zareix/gh-actions/.github/workflows/release.yml@main
    with:
      tag: ${{ needs.version.outputs.version }}
      assets: git_desktop_release
